<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Livros</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalogoLivros/css/style.css' %}">

</head>
<body>
    <div class="container">
        <div class="form-area">
            <form hx-post="{% url 'catalogoLivros:catalogoDeLivros' %}" hx-target="#area-tabela" hx-swap="innerHTML" class="formulario">
                {%csrf_token%}
                <div class="input">
                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" placeholder="Ex.: O Iluminado" required>
                </div>

                <div class="input">
                    <label for="autor">Autor</label>
                    <input type="text" name="autor" id="autor" placeholder="Ex.: Stephen King" required>
                </div>

                <div class="input">
                    <label for="ano">Ano de Publicação</label>
                    <input type="number" name="ano" id="ano" placeholder="Ex.: 1977" required>
                </div>

                <div class="input">
                    <label for="genero">Gênero</label>
                    <input type="text" name="genero" id="genero" placeholder="Ex.: Terror" required>
                </div>

                <div class="input">
                    <div>
                        <label for="status">Disponível?</label>
                        <input type="checkbox" name="status" id="status" value="disponivel">
                    </div>
                </div>

                <button type="submit" class="submit-button"> Cadastrar </button>

                <button type="button" class="table-button" hx-get="{% url 'catalogoLivros:buscarTabela' %}" hx-target="#area-tabela" hx-swap="innerHTML">
                     Mostrar livros cadastrados
                </button>
            </form>
        </div>

        <div id="area-tabela" style="margin-top: 15px;"></div>
</body>
</html>
