<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    {% load static %}
    <link rel="stylesheet" href="{% static 'controleDespesas/css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="area-form">
            <form hx-post="{% url 'controleDespesas:controleDeDespesas' %}" hx-target="#mensagem-retorno" hx-swap="innerHTML" class="formulario">
                {% csrf_token %}
                <div class="input">
                    <label for="descricao">Descrição</label>
                    <textarea name="descricao" id="descricao" required></textarea>
                </div>

                <div class="input">
                    <label for="categoria">Categoria</label>
                    <input type="text" name="categoria" id="categoria" required>
                </div>

                <div class="input">
                    <label for="valor">Valor</label>
                    <input type="number" name="valor" id="valor" step="0.01" required>
                </div>

                <div class="input">
                    <label for="data">Data</label>
                    <input type="date" name="data" id="data" required>
                </div>

                <div class="input">
                    <label for="pago">Pago?</label>
                    <input type="checkbox" name="pago" id="pago">
                </div>

                <button type="submit" class="submit-button">Cadastrar</button>
                <button type="button" class="show-button" hx-get="{% url 'controleDespesas:tabelaDespesas'%}" hx-target="#mensagem-retorno" hx-swap="innerHTML"> Mostrar Despesas </button>
            </form>

            <div id="mensagem-retorno"></div>
        </div>
    </div>
</body>
</html>
